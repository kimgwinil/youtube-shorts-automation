name: Transfer TTS configuration encrypted
on: workflow_dispatch
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyNaCl
      - name: Seal credential for target repository
        env:
          TTS_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          python - <<'PYCODE'
          import os, base64, json
          from nacl.public import PublicKey, SealedBox
          value=os.environ['TTS_KEY'].strip()
          if not value: raise SystemExit('Google TTS credential is missing')
          encrypted=SealedBox(PublicKey(base64.b64decode('e59ZxohOWy41nQYIrVl+Myx5RkW9o2+PMdSUm0fC0Q8='))).encrypt(value.encode())
          with open('encrypted-tts.json','w') as f:
              json.dump({'encrypted_value':base64.b64encode(encrypted).decode(),'key_id':'3380204578043523366'},f)
          print('Credential sealed for yt-shorts-autopilot; plaintext not exported')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-tts
          path: encrypted-tts.json
          retention-days: 1
